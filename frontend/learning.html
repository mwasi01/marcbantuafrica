<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning | Marcbantu Africa</title>
    <meta name="theme-color" content="#1a3c2e">
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/assets/css/main.css">
    <link rel="stylesheet" href="/assets/css/app.css">
    <link rel="stylesheet" href="/assets/css/print.css" media="print">
</head>

<body>

    <div class="app-layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand"><i class="fas fa-seedling"></i><span>Marcbantu <span>Africa</span></span></div>
            <nav class="sidebar-nav">
                <div class="section-label">Main</div>
                <a href="/dashboard.html"><i class="fas fa-th-large"></i> Dashboard</a>
                <a href="/records.html"><i class="fas fa-book"></i> Farm Records</a>
                <a href="/planning.html"><i class="fas fa-calendar-alt"></i> Planning</a>
                <a href="/finance.html"><i class="fas fa-chart-pie"></i> Finance</a>
                <a href="/decisions.html"><i class="fas fa-lightbulb"></i> Decisions</a>
                <div class="section-label">Operations</div>
                <a href="/operations.html"><i class="fas fa-tasks"></i> Operations</a>
                <a href="/market.html"><i class="fas fa-store"></i> Market & Sales</a>
                <a href="/weather.html"><i class="fas fa-cloud-sun"></i> Weather</a>
                <a href="/pest.html"><i class="fas fa-bug"></i> Pest & Disease</a>
                <div class="section-label">Growth</div>
                <a href="/learning.html" class="active"><i class="fas fa-graduation-cap"></i> Learning</a>
                <a href="/profile.html"><i class="fas fa-user-circle"></i> My Profile</a>
                <div class="section-label">Account</div>
                <a href="#" data-action="logout"><i class="fas fa-sign-out-alt"></i> Log Out</a>
            </nav>
        </aside>

        <main class="main-content">
            <div class="topbar">
                <div style="display:flex;align-items:center;gap:1rem">
                    <button class="menu-toggle-app"><i class="fas fa-bars"></i></button>
                    <h1>Learning & Advice</h1>
                </div>
            </div>

            <div class="kpi-grid" id="learning-kpis"></div>

            <div class="panel">
                <div class="panel-head">
                    <h3><i class="fas fa-book-reader"></i> My Courses</h3>
                </div>
                <div id="my-courses"></div>
            </div>

            <div class="panel">
                <div class="panel-head">
                    <h3><i class="fas fa-graduation-cap"></i> All Courses</h3>
                </div>
                <div id="all-courses"
                    style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1.2rem"></div>
            </div>

            <div class="panel">
                <div class="panel-head">
                    <h3><i class="fas fa-play-circle"></i> Video Library</h3>
                </div>
                <div id="video-list"
                    style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem"></div>
            </div>

            <div class="panel">
                <div class="panel-head">
                    <h3><i class="fas fa-robot"></i> Ask Marcbantu AI</h3>
                </div>
                <div id="chat-box"
                    style="background:#fbfcf9;border-radius:14px;padding:1.2rem;border:1px solid #e2e8dd;max-height:340px;overflow-y:auto;margin-bottom:1rem">
                </div>
                <div style="display:flex;gap:.6rem">
                    <input type="text" id="chat-input" placeholder="Ask a question..."
                        style="flex:1;padding:12px 16px;border-radius:30px;border:1.5px solid #e2e8dd;font-family:inherit">
                    <button id="chat-send" class="btn-primary"
                        style="width:48px;height:48px;border-radius:50%;padding:0;justify-content:center"><i
                            class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </main>
    </div>

    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/app.js"></script>
    <script src="/assets/js/learning.js"></script>
    <script src="/assets/js/register-sw.js"></script>
</body>

</html>
