<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages | Marcbantu Africa</title>
    <meta name="theme-color" content="#1a3c2e">
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/assets/css/main.css">
    <link rel="stylesheet" href="/assets/css/app.css">
    <style>
        .messages-layout {
            display: grid;
            grid-template-columns: 340px 1fr;
            gap: 0;
            background: #fff;
            border-radius: 16px;
            border: 1px solid #e2e8dd;
            overflow: hidden;
            height: calc(100vh - 180px);
            min-height: 500px;
        }

        .conv-list {
            border-right: 1px solid #eef1ea;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .conv-list-header {
            padding: 16px;
            border-bottom: 1px solid #eef1ea;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .conv-list-search {
            padding: 10px 16px;
            border-bottom: 1px solid #eef1ea;
        }

        .conv-list-search input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 20px;
            border: 1.5px solid #e2e8dd;
            font-family: inherit;
            font-size: .9rem;
            background: #fbfcf9;
        }

        .conv-items {
            flex: 1;
            overflow-y: auto;
        }

        .conv-item {
            padding: 14px 16px;
            border-bottom: 1px solid #f5f7f3;
            cursor: pointer;
            transition: background .15s;
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }

        .conv-item:hover {
            background: #fbfcf9;
        }

        .conv-item.active {
            background: #e8f0e1;
        }

        .conv-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #1a3c2e;
            color: #e6b422;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: .9rem;
            flex-shrink: 0;
        }

        .conv-body {
            flex: 1;
            min-width: 0;
        }

        .conv-name {
            font-weight: 700;
            color: #1a3c2e;
            font-size: .92rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .conv-time {
            font-size: .72rem;
            color: #8a9c8c;
            font-weight: 400;
        }

        .conv-preview {
            font-size: .82rem;
            color: #4a5a4a;
            margin-top: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .conv-badge {
            display: inline-block;
            background: #c0392b;
            color: #fff;
            font-size: .7rem;
            font-weight: 700;
            padding: 1px 7px;
            border-radius: 20px;
            margin-left: 6px;
            min-width: 18px;
            text-align: center;
        }

        .chat-area {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            padding: 14px 20px;
            border-bottom: 1px solid #eef1ea;
            display: flex;
            gap: 12px;
            align-items: center;
            background: #fbfcf9;
        }

        .chat-header-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #1a3c2e;
            color: #e6b422;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: .85rem;
            flex-shrink: 0;
        }

        .chat-header-name {
            font-weight: 700;
            color: #1a3c2e;
            font-size: .95rem;
        }

        .chat-header-loc {
            font-size: .8rem;
            color: #8a9c8c;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f9faf7;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .msg {
            max-width: 75%;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .msg.mine {
            align-self: flex-end;
            align-items: flex-end;
        }

        .msg.theirs {
            align-self: flex-start;
            align-items: flex-start;
        }

        .msg-bubble {
            padding: 10px 14px;
            border-radius: 16px;
            font-size: .92rem;
            line-height: 1.45;
            word-wrap: break-word;
            white-space: pre-wrap;
            max-width: 100%;
        }

        .msg.mine .msg-bubble {
            background: #1a3c2e;
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .msg.theirs .msg-bubble {
            background: #fff;
            color: #1a3c2e;
            border: 1px solid #eef1ea;
            border-bottom-left-radius: 4px;
        }

        .msg-meta {
            font-size: .7rem;
            color: #8a9c8c;
            padding: 0 4px;
        }

        .msg-meta .read {
            color: #2e7d32;
            margin-left: 4px;
        }

        .chat-compose {
            padding: 12px 16px;
            border-top: 1px solid #eef1ea;
            background: #fff;
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .chat-compose textarea {
            flex: 1;
            padding: 12px 16px;
            border-radius: 24px;
            border: 1.5px solid #e2e8dd;
            font-family: inherit;
            font-size: .92rem;
            resize: none;
            max-height: 120px;
            min-height: 44px;
            background: #fbfcf9;
        }

        .chat-compose button {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #e6b422;
            color: #1a3c2e;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            flex-shrink: 0;
            transition: all .15s;
        }

        .chat-compose button:hover:not(:disabled) {
            background: #d4a017;
        }

        .chat-compose button:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        .empty-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #8a9c8c;
            padding: 40px;
            text-align: center;
        }

        .empty-chat i {
            font-size: 3rem;
            color: #d4a017;
            opacity: .5;
            margin-bottom: 1rem;
        }

        @media (max-width: 768px) {
            .messages-layout {
                grid-template-columns: 1fr;
                height: calc(100vh - 140px);
            }

            .messages-layout.showing-chat .conv-list {
                display: none;
            }

            .messages-layout:not(.showing-chat) .chat-area {
                display: none;
            }

            .chat-back {
                display: flex !important;
            }
        }

        .chat-back {
            display: none;
            background: none;
            border: none;
            color: #1a3c2e;
            font-size: 1.1rem;
            cursor: pointer;
            padding: 4px 8px;
            margin-right: 4px;
        }
    </style>
</head>

<body>

    <div class="app-layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand"><i class="fas fa-seedling"></i><span>Marcbantu <span>Africa</span></span></div>
            <nav class="sidebar-nav">
                <div class="section-label">Main</div>
                <a href="/dashboard.html"><i class="fas fa-th-large"></i> Dashboard</a>
                <a href="/records.html"><i class="fas fa-book"></i> Farm Records</a>
                <a href="/planning.html"><i class="fas fa-calendar-alt"></i> Planning</a>
                <a href="/finance.html"><i class="fas fa-chart-pie"></i> Finance</a>
                <a href="/decisions.html"><i class="fas fa-lightbulb"></i> Decisions</a>
                <div class="section-label">Operations</div>
                <a href="/operations.html"><i class="fas fa-tasks"></i> Operations</a>
                <a href="/market.html"><i class="fas fa-store"></i> Market & Sales</a>
                <a href="/weather.html"><i class="fas fa-cloud-sun"></i> Weather</a>
                <a href="/pest.html"><i class="fas fa-bug"></i> Pest & Disease</a>
                <div class="section-label">Community</div>
                <a href="/feed.html"><i class="fas fa-users"></i> Feed</a>
                <a href="/messages.html" class="active"><i class="fas fa-comments"></i> Messages <span id="msg-badge" style="display:none;background:#c0392b;color:#fff;font-size:10px;padding:1px 6px;border-radius:20px;margin-left:auto"></span></a>
                <a href="/learning.html"><i class="fas fa-graduation-cap"></i> Learning</a>
                <a href="/profile.html"><i class="fas fa-user-circle"></i> My Profile</a>
                <div class="section-label">Account</div>
                <a href="#" data-action="logout"><i class="fas fa-sign-out-alt"></i> Log Out</a>
            </nav>
        </aside>

        <main class="main-content">
            <div class="topbar">
                <div style="display:flex;align-items:center;gap:1rem">
                    <button class="menu-toggle-app"><i class="fas fa-bars"></i></button>
                    <h1>Messages</h1>
                </div>
                <button class="btn-primary" id="new-chat-btn"><i class="fas fa-plus"></i> New Message</button>
            </div>

            <div class="messages-layout" id="messages-layout">
                <!-- Conversation list -->
                <div class="conv-list">
                    <div class="conv-list-header">
                        <strong style="color:#1a3c2e;font-size:.95rem">Conversations</strong>
                    </div>
                    <div class="conv-list-search">
                        <input type="text" id="conv-search" placeholder="Search conversations...">
                    </div>
                    <div class="conv-items" id="conv-items">
                        <div style="padding:40px 20px;text-align:center;color:#8a9c8c;font-size:.85rem">
                            <i class="fas fa-spinner fa-spin"></i> Loading...
                        </div>
                    </div>
                </div>

                <!-- Chat area -->
                <div class="chat-area" id="chat-area">
                    <div class="empty-chat" id="empty-chat">
                        <i class="fas fa-comments"></i>
                        <h3 style="color:#1a3c2e;margin:0 0 .3rem">No conversation selected</h3>
                        <p style="margin:0">Pick a conversation or start a new one.</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/app.js"></script>
    <script src="/assets/js/messages.js"></script>
    <script src="/assets/js/register-sw.js"></script>
</body>

</html>
