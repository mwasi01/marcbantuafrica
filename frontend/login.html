<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | Marcbantu Africa</title>
    <meta name="theme-color" content="#1a3c2e">
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/assets/css/main.css">
    <link rel="stylesheet" href="/assets/css/app.css">
    <style>
        body {
            background: linear-gradient(135deg, #183e2c 0%, #2a5d3f 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px
        }

        .login-box {
            background: #fff;
            border-radius: 24px;
            padding: 2.5rem 2rem;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 24px 48px rgba(0, 0, 0, .2)
        }

        .login-logo {
            text-align: center;
            margin-bottom: 1.5rem
        }

        .login-logo i {
            font-size: 3rem;
            color: #d4a017
        }

        .login-logo h1 {
            color: #1a3c2e;
            font-size: 1.5rem;
            margin-top: .5rem;
            font-weight: 800
        }

        .login-logo h1 span {
            color: #d4a017
        }

        .login-logo p {
            color: #4a5a4a;
            font-size: .9rem;
            margin-top: .4rem
        }

        .form-group {
            margin-bottom: 1rem;
            display: flex;
            flex-direction: column;
            gap: 6px
        }

        .form-group label {
            font-size: .85rem;
            font-weight: 600;
            color: #1a3c2e
        }

        .form-group input {
            padding: 12px;
            border-radius: 10px;
            border: 1.5px solid #e2e8dd;
            font-family: inherit;
            font-size: .95rem
        }

        .form-group input:focus {
            outline: none;
            border-color: #e6b422
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            border-radius: 40px;
            background: #e6b422;
            color: #1a3c2e;
            font-weight: 800;
            border: none;
            font-size: 1rem;
            cursor: pointer;
            font-family: inherit;
            margin-top: .5rem;
            transition: all .2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px
        }

        .btn-submit:hover:not(:disabled) {
            background: #d4a017
        }

        .btn-submit:disabled {
            opacity: .6;
            cursor: not-allowed
        }

        .login-links {
            text-align: center;
            margin-top: 1.5rem;
            font-size: .88rem;
            color: #4a5a4a
        }

        .login-links a {
            color: #1a3c2e;
            font-weight: 600;
            text-decoration: none
        }

        .login-links a:hover {
            color: #d4a017
        }

        .back-home {
            text-align: center;
            margin-top: 2rem
        }

        .back-home a {
            color: #c8d6ca;
            text-decoration: none;
            font-size: .85rem
        }
    </style>
</head>

<body>

    <div class="login-box">
        <div class="login-logo">
            <i class="fas fa-seedling"></i>
            <h1>Marcbantu<span> Africa</span></h1>
            <p>Welcome back to your farm dashboard</p>
        </div>

        <form id="loginForm" novalidate>
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" placeholder="0712 345 678" required autocomplete="tel">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Your password" required
                    autocomplete="current-password">
            </div>
            <button type="submit" class="btn-submit">
                <i class="fas fa-sign-in-alt"></i> Log In
            </button>
        </form>

        <div class="login-links">
            <p>New to Marcbantu? <a href="/register.html">Create an account</a></p>
            <p style="margin-top:.5rem"><a href="#" id="forgotLink" style="color:#4a5a4a">Forgot password?</a></p>
        </div>

        <div class="back-home">
            <a href="/"><i class="fas fa-arrow-left"></i> Back to home</a>
        </div>
    </div>

    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/app.js"></script>
    <script src="/assets/js/auth.js"></script>
    <script src="/assets/js/register-sw.js"></script>
</body>

</html>
