<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feed | Marcbantu Africa</title>
    <meta name="theme-color" content="#1a3c2e">
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/assets/css/main.css">
    <link rel="stylesheet" href="/assets/css/app.css">
</head>

<body>

    <div class="app-layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand"><i class="fas fa-seedling"></i><span>Marcbantu <span>Africa</span></span></div>
            <nav class="sidebar-nav">
                <div class="section-label">Main</div>
                <a href="/dashboard.html"><i class="fas fa-th-large"></i> Dashboard</a>
                <a href="/records.html"><i class="fas fa-book"></i> Farm Records</a>
                <a href="/planning.html"><i class="fas fa-calendar-alt"></i> Planning</a>
                <a href="/finance.html"><i class="fas fa-chart-pie"></i> Finance</a>
                <a href="/decisions.html"><i class="fas fa-lightbulb"></i> Decisions</a>
                <div class="section-label">Operations</div>
                <a href="/operations.html"><i class="fas fa-tasks"></i> Operations</a>
                <a href="/market.html"><i class="fas fa-store"></i> Market & Sales</a>
                <a href="/weather.html"><i class="fas fa-cloud-sun"></i> Weather</a>
                <a href="/pest.html"><i class="fas fa-bug"></i> Pest & Disease</a>
                <div class="section-label">Community</div>
                <a href="/feed.html" class="active"><i class="fas fa-users"></i> Feed</a>
                <a href="/messages.html"><i class="fas fa-comments"></i> Messages <span id="msg-badge-sidebar" style="display:none;background:#c0392b;color:#fff;font-size:10px;padding:1px 6px;border-radius:20px;margin-left:auto"></span></a>
                <a href="/learning.html"><i class="fas fa-graduation-cap"></i> Learning</a>
                <a href="/profile.html"><i class="fas fa-user-circle"></i> My Profile</a>
                <div class="section-label">Account</div>
                <a href="#" data-action="logout"><i class="fas fa-sign-out-alt"></i> Log Out</a>
            </nav>
        </aside>

        <main class="main-content">
            <div class="topbar">
                <div style="display:flex;align-items:center;gap:1rem">
                    <button class="menu-toggle-app"><i class="fas fa-bars"></i></button>
                    <h1>Farmer Feed</h1>
                </div>
                <button class="btn-primary no-print" id="compose-btn"><i class="fas fa-pen"></i> Share Update</button>
            </div>

            <div style="display:grid;grid-template-columns:1fr 320px;gap:1.5rem;align-items:start" id="feed-layout">

                <!-- MAIN FEED COLUMN -->
                <div>
                    <!-- Tabs -->
                    <div class="panel" style="padding:0;overflow:hidden">
                        <div style="display:flex;border-bottom:1px solid #eef1ea">
                            <button class="feed-tab active" data-tab="all" style="flex:1;padding:14px;background:none;border:none;font-weight:700;color:#1a3c2e;cursor:pointer;font-family:inherit;font-size:.92rem;border-bottom:3px solid transparent;">
                                <i class="fas fa-globe"></i> All Farmers
                            </button>
                            <button class="feed-tab" data-tab="following" style="flex:1;padding:14px;background:none;border:none;font-weight:700;color:#8a9c8c;cursor:pointer;font-family:inherit;font-size:.92rem;border-bottom:3px solid transparent;">
                                <i class="fas fa-user-check"></i> Following
                            </button>
                            <button class="feed-tab" data-tab="mine" style="flex:1;padding:14px;background:none;border:none;font-weight:700;color:#8a9c8c;cursor:pointer;font-family:inherit;font-size:.92rem;border-bottom:3px solid transparent;">
                                <i class="fas fa-user"></i> My Posts
                            </button>
                        </div>
                    </div>

                    <!-- Feed stream -->
                    <div id="feed-stream" style="margin-top:1rem"></div>

                    <!-- Load more -->
                    <div id="load-more" style="text-align:center;padding:1rem;display:none">
                        <button class="btn-outline" id="load-more-btn" style="width:100%;justify-content:center">
                            <i class="fas fa-chevron-down"></i> Load More
                        </button>
                    </div>
                </div>

                <!-- SIDEBAR -->
                <aside>
                    <!-- My mini profile -->
                    <div class="panel" id="my-mini-profile" style="margin-bottom:1rem">
                        <div style="display:flex;gap:12px;align-items:center">
                            <div id="my-avatar" style="width:48px;height:48px;border-radius:50%;background:#1a3c2e;color:#e6b422;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.1rem;flex-shrink:0">?</div>
                            <div style="flex:1;min-width:0">
                                <div id="my-name" style="font-weight:700;color:#1a3c2e;font-size:.95rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">Loading...</div>
                                <div id="my-location" style="font-size:.82rem;color:#4a5a4a">—</div>
                            </div>
                        </div>
                        <div style="display:flex;gap:1rem;margin-top:1rem;font-size:.82rem">
                            <div style="text-align:center;flex:1"><strong id="stat-posts" style="display:block;font-size:1.1rem;color:#1a3c2e">0</strong><span style="color:#8a9c8c">Posts</span></div>
                            <div style="text-align:center;flex:1"><strong id="stat-followers" style="display:block;font-size:1.1rem;color:#1a3c2e">0</strong><span style="color:#8a9c8c">Followers</span></div>
                            <div style="text-align:center;flex:1"><strong id="stat-following" style="display:block;font-size:1.1rem;color:#1a3c2e">0</strong><span style="color:#8a9c8c">Following</span></div>
                        </div>
                    </div>

                    <!-- Suggested farmers -->
                    <div class="panel">
                        <div class="panel-head" style="padding-bottom:.6rem">
                            <h3 style="font-size:.95rem"><i class="fas fa-user-plus"></i> Suggested Farmers</h3>
                        </div>
                        <div id="suggested-list" style="display:flex;flex-direction:column;gap:.6rem">
                            <div style="text-align:center;padding:20px;color:#8a9c8c;font-size:.85rem">
                                <i class="fas fa-spinner fa-spin"></i> Loading...
                            </div>
                        </div>
                    </div>
                </aside>
            </div>
        </main>
    </div>

    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/app.js"></script>
    <script src="/assets/js/feed.js"></script>
    <script src="/assets/js/register-sw.js"></script>
</body>

</html>
