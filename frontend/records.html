<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farm Records | Marcbantu Africa</title>
    <meta name="theme-color" content="#1a3c2e">
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/assets/css/main.css">
    <link rel="stylesheet" href="/assets/css/app.css">
    <link rel="stylesheet" href="/assets/css/print.css" media="print">
</head>

<body>

    <div class="app-layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand"><i class="fas fa-seedling"></i><span>Marcbantu <span>Africa</span></span></div>
            <nav class="sidebar-nav">
                <div class="section-label">Main</div>
                <a href="/dashboard.html"><i class="fas fa-th-large"></i> Dashboard</a>
                <a href="/records.html" class="active"><i class="fas fa-book"></i> Farm Records</a>
                <a href="/planning.html"><i class="fas fa-calendar-alt"></i> Planning</a>
                <a href="/finance.html"><i class="fas fa-chart-pie"></i> Finance</a>
                <a href="/decisions.html"><i class="fas fa-lightbulb"></i> Decisions</a>
                <div class="section-label">Operations</div>
                <a href="/operations.html"><i class="fas fa-tasks"></i> Operations</a>
                <a href="/market.html"><i class="fas fa-store"></i> Market & Sales</a>
                <a href="/weather.html"><i class="fas fa-cloud-sun"></i> Weather</a>
                <a href="/pest.html"><i class="fas fa-bug"></i> Pest & Disease</a>
                <div class="section-label">Growth</div>
                <a href="/feed.html"><i class="fas fa-users"></i> Feed</a>
                <a href="/learning.html"><i class="fas fa-graduation-cap"></i> Learning</a>
                <a href="/profile.html"><i class="fas fa-user-circle"></i> My Profile</a>
                <div class="section-label">Account</div>
                <a href="#" data-action="logout"><i class="fas fa-sign-out-alt"></i> Log Out</a>
            </nav>
        </aside>

        <main class="main-content">
            <div class="topbar">
                <div style="display:flex;align-items:center;gap:1rem">
                    <button class="menu-toggle-app"><i class="fas fa-bars"></i></button>
                    <h1>Farm Records</h1>
                </div>
                <button class="btn-primary no-print" data-action="new-record"><i class="fas fa-plus"></i> Add
                    Record</button>
            </div>

            <div class="panel no-print">
                <form id="filter-form"
                    style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;align-items:end">
                    <label style="display:flex;flex-direction:column;gap:6px">
                        <span style="font-size:13px;font-weight:600;color:#1a3c2e">Farm</span>
                        <select name="farm_id">
                            <option value="">All farms</option>
                        </select>
                    </label>
                    <label style="display:flex;flex-direction:column;gap:6px">
                        <span style="font-size:13px;font-weight:600;color:#1a3c2e">Type</span>
                        <select name="type">
                            <option value="">All types</option>
                            <option value="crop_activity">Crop Activity</option>
                            <option value="livestock">Livestock</option>
                            <option value="poultry">Poultry</option>
                            <option value="input">Input</option>
                            <option value="harvest">Harvest</option>
                            <option value="sale">Sale</option>
                            <option value="expense">Expense</option>
                            <option value="observation">Observation</option>
                        </select>
                    </label>
                    <label style="display:flex;flex-direction:column;gap:6px">
                        <span style="font-size:13px;font-weight:600;color:#1a3c2e">From</span>
                        <input type="date" name="from">
                    </label>
                    <label style="display:flex;flex-direction:column;gap:6px">
                        <span style="font-size:13px;font-weight:600;color:#1a3c2e">To</span>
                        <input type="date" name="to">
                    </label>
                    <label style="display:flex;flex-direction:column;gap:6px">
                        <span style="font-size:13px;font-weight:600;color:#1a3c2e">Search</span>
                        <input type="text" name="q" placeholder="Search...">
                    </label>
                </form>
            </div>

            <div class="panel">
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Farm</th>
                                <th>Type</th>
                                <th>Activity</th>
                                <th>Description</th>
                                <th style="text-align:right">Amount</th>
                                <th style="text-align:right">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="records-table-body">
                            <tr>
                                <td colspan="7" style="text-align:center;padding:40px;color:#8a9c8c"><i
                                        class="fas fa-spinner fa-spin"></i> Loading...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div id="pagination"
                    style="display:flex;justify-content:center;align-items:center;gap:4px;margin-top:1rem;flex-wrap:wrap">
                </div>
            </div>
        </main>
    </div>

    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/app.js"></script>
    <script src="/assets/js/records.js"></script>
    <script src="/assets/js/offline.js"></script>
    <script src="/assets/js/farms.js"></script>
    <script src="/assets/js/register-sw.js"></script>
</body>

</html>
