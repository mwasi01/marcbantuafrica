<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather | Marcbantu Africa</title>
    <meta name="theme-color" content="#1a3c2e">
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/assets/css/main.css">
    <link rel="stylesheet" href="/assets/css/app.css">
    <link rel="stylesheet" href="/assets/css/print.css" media="print">
</head>

<body>

    <div class="app-layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand"><i class="fas fa-seedling"></i><span>Marcbantu <span>Africa</span></span></div>
            <nav class="sidebar-nav">
                <div class="section-label">Main</div>
                <a href="/dashboard.html"><i class="fas fa-th-large"></i> Dashboard</a>
                <a href="/records.html"><i class="fas fa-book"></i> Farm Records</a>
                <a href="/planning.html"><i class="fas fa-calendar-alt"></i> Planning</a>
                <a href="/finance.html"><i class="fas fa-chart-pie"></i> Finance</a>
                <a href="/decisions.html"><i class="fas fa-lightbulb"></i> Decisions</a>
                <div class="section-label">Operations</div>
                <a href="/operations.html"><i class="fas fa-tasks"></i> Operations</a>
                <a href="/market.html"><i class="fas fa-store"></i> Market & Sales</a>
                <a href="/weather.html" class="active"><i class="fas fa-cloud-sun"></i> Weather</a>
                <a href="/pest.html"><i class="fas fa-bug"></i> Pest & Disease</a>
                <div class="section-label">Growth</div>
                <a href="/feed.html"><i class="fas fa-users"></i> Feed</a>
                <a href="/messages.html"><i class="fas fa-comments"></i> Messages <span id="msg-badge-sidebar" style="display:none;background:#c0392b;color:#fff;font-size:10px;padding:1px 6px;border-radius:20px;margin-left:auto"></span></a>
                <a href="/learning.html"><i class="fas fa-graduation-cap"></i> Learning</a>
                <a href="/profile.html"><i class="fas fa-user-circle"></i> My Profile</a>
                <div class="section-label">Account</div>
                <a href="#" data-action="logout"><i class="fas fa-sign-out-alt"></i> Log Out</a>
            </nav>
        </aside>

        <main class="main-content">
            <div class="topbar">
                <div style="display:flex;align-items:center;gap:1rem">
                    <button class="menu-toggle-app"><i class="fas fa-bars"></i></button>
                    <h1>Weather & Climate</h1>
                </div>
                <select id="farm-selector"
                    style="padding:8px 14px;border-radius:30px;border:1.5px solid #e2e8dd;background:#fff"></select>
            </div>

            <div id="current-weather"></div>

            <div class="panel">
                <div class="panel-head">
                    <h3><i class="fas fa-calendar-week"></i> 7-Day Forecast</h3>
                </div>
                <div id="forecast-days"
                    style="display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:.8rem"></div>
            </div>

            <div class="panel">
                <div class="panel-head">
                    <h3><i class="fas fa-lightbulb"></i> Farming Advice</h3>
                </div>
                <div id="weather-advice"></div>
            </div>

            <div class="panel">
                <div class="panel-head">
                    <h3><i class="fas fa-exclamation-triangle"></i> Weather Alerts</h3>
                </div>
                <div id="weather-alerts"></div>
            </div>

            <div class="panel">
                <div class="panel-head">
                    <h3><i class="fas fa-tint"></i> Rainfall Tracking (30 days)</h3>
                </div>
                <div id="rainfall-history"></div>
            </div>
        </main>
    </div>

    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/app.js"></script>
    <script src="/assets/js/weather.js"></script>
    <script src="/assets/js/register-sw.js"></script>
</body>

</html>
